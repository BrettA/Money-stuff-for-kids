name: Ingest completed edition

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: Short-lived HTTPS URL for the completed ZIP package
        required: true
        type: string
      package_sha256:
        description: Lowercase SHA-256 digest of the ZIP
        required: true
        type: string
      edition_id:
        description: Canonical dated edition ID
        required: true
        type: string
      package_delete_url:
        description: Single-use signed DELETE URL for temporary-package cleanup
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EDITION_ID: ${{ inputs.edition_id }}
      PACKAGE_URL: ${{ inputs.package_url }}
      PACKAGE_SHA256: ${{ inputs.package_sha256 }}
      PACKAGE_DELETE_URL: ${{ inputs.package_delete_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Validate dispatch metadata
        run: |
          [[ "$EDITION_ID" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*$ ]]
          [[ "$PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PACKAGE_URL" == https://* ]]
          [[ -z "$PACKAGE_DELETE_URL" || "$PACKAGE_DELETE_URL" == https://* ]]
      - name: Prepare deterministic ingestion branch
        id: branch
        run: scripts/prepare-ingestion-branch.sh "$EDITION_ID"
      - name: Download and verify package
        run: |
          curl --fail --silent --show-error --location --proto '=https' --max-filesize 26214400 \
            --output "$RUNNER_TEMP/edition.zip" "$PACKAGE_URL"
          echo "$PACKAGE_SHA256  $RUNNER_TEMP/edition.zip" | sha256sum --check --strict
      - name: Install and validate canonical inputs
        run: npm run ingest -- --archive "$RUNNER_TEMP/edition.zip" --edition-id "$EDITION_ID"
      - name: Test and regenerate site
        run: |
          npm test
          npm run publish
          npm run check
      - name: Commit and push ingestion branch
        env:
          INGESTION_BRANCH: ${{ steps.branch.outputs.branch }}
          BRANCH_PUSH_LEASE: ${{ steps.branch.outputs.push_lease }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "Publish $EDITION_ID"
          git push --set-upstream \
            --force-with-lease="refs/heads/$INGESTION_BRANCH:$BRANCH_PUSH_LEASE" \
            origin "HEAD:refs/heads/$INGESTION_BRANCH"
      - name: Open pull request (never auto-merge)
        env:
          GH_TOKEN: ${{ github.token }}
          INGESTION_BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          gh pr view "$INGESTION_BRANCH" --json url --jq .url || \
            gh pr create --base main --head "$INGESTION_BRANCH" \
              --title "Publish $EDITION_ID" \
              --body "Automated ingestion of the digest-verified, schema-version-2 edition package. This pull request requires normal review and is not auto-merged."
      - name: Delete temporary package
        # A failed job must retain the exact digest-verified package for a job
        # re-run. The daily orphan cleanup still removes it after 24 hours.
        if: ${{ success() && inputs.package_delete_url != '' }}
        run: curl --fail --silent --show-error --request DELETE --proto '=https' "$PACKAGE_DELETE_URL"
