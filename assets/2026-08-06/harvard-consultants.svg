ze="19" font-weight="700">PYTHON INCLUDED</text><text x="400" y="400" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">Salary: $0. Prestige: valuable. Snakes: apparently also compensation.</text></svg>