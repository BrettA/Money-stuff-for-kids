<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">SoftBank OpenAI margin loan illustration</title><desc id="d">SoftBank pledges a pile of OpenAI shares to a bank, receives ten billion dollars, and wheels the money toward a second pile of OpenAI shares.</desc><rect width="800" height="450" rx="30" fill="#eef5f0"/><rect x="45" y="105" width="220" height="220" rx="20" fill="#fff" stroke="#17201b" stroke-width="5"/><text x="155" y="145" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">BANK</text><rect x="75" y="185" width="160" height="85" rx="12" fill="#cfe8d7" stroke="#17201b" stroke-width="4"/><text x="155" y="220" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">$10B</text><text x="155" y="248" text-anchor="middle" font-family="Arial" font-size="16">LOAN</text><path d="M275 225h110" stroke="#17201b" stroke-width="8"/><rect x="385" y="115" width="150" height="95" rx="12" fill="#fff" stroke="#17201b" stroke-width="4"/><text x="460" y="150" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">OPENAI</text><text x="460" y="180" text-anchor="middle" font-family="Arial" font-size="18">COLLATERAL</text><text x="460" y="305" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">SoftBank</text><circle cx="460" cy="255" r="32" fill="#ffd7b5" stroke="#17201b" stroke-width="4"/><path d="M535 225h105" stroke="#17201b" stroke-width="8"/><rect x="640" y="105" width="120" height="220" rx="18" fill="#fff" stroke="#17201b" stroke-width="5"/><text x="700" y="155" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">MORE</text><text x="700" y="185" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">OPENAI</text><text x="400" y="397" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Borrow against OpenAI → buy more OpenAI.</text></svg>