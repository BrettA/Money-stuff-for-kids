<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">SpaceX SPV shares illustration</title><desc id="d">An investor holds an SPV statement beside a locked box labeled SpaceX shares while a promoter disappears toward a tunnel with a yacht.</desc><rect width="800" height="450" rx="30" fill="#f6efe3"/><rect x="315" y="120" width="240" height="190" rx="18" fill="#fff" stroke="#17201b" stroke-width="6"/><rect x="365" y="74" width="140" height="95" rx="42" fill="none" stroke="#17201b" stroke-width="14"/><text x="435" y="215" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#17201b">SpaceX</text><text x="435" y="252" text-anchor="middle" font-family="Arial" font-size="22" fill="#17201b">SHARES?</text><circle cx="155" cy="176" r="48" fill="#ffd7b5" stroke="#17201b" stroke-width="5"/><path d="M105 340q50-110 100 0" fill="#86b8a2" stroke="#17201b" stroke-width="5"/><rect x="63" y="235" width="190" height="82" rx="10" fill="#fff" stroke="#17201b" stroke-width="4"/><text x="158" y="267" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">SPV STATEMENT</text><text x="158" y="294" text-anchor="middle" font-family="Arial" font-size="17">YOU OWN SHARES</text><path d="M620 150h120v140H620z" fill="#dad3c8" stroke="#17201b" stroke-width="5"/><path d="M620 150q60-70 120 0" fill="#333"/><text x="680" y="330" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">TUNNEL</text><path d="M590 365q55-35 110 0l-20 28h-70z" fill="#8fc4dd" stroke="#17201b" stroke-width="4"/><path d="M640 330v38" stroke="#17201b" stroke-width="4"/><path d="M640 330l35 20h-35z" fill="#ef775f"/><text x="400" y="415" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#17201b">When the lockup ends, the paperwork has to become real shares.</text></svg>