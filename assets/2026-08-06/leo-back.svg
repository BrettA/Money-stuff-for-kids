<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Leopold Aschenbrenner investment comeback illustration</title><desc id="d">A young investor climbs out of a wrecked leveraged hedge fund cart while carrying a four hundred million dollar venture capital suitcase and a wedding ring toward an AI sign.</desc><rect width="800" height="450" rx="30" fill="#eef1fa"/><path d="M70 310h250l-45 65H95z" fill="#ef8a78" stroke="#17201b" stroke-width="5"/><circle cx="125" cy="380" r="28" fill="#333"/><circle cx="260" cy="380" r="28" fill="#333"/><text x="190" y="345" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">LEVERAGED</text><text x="190" y="370" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">HEDGE FUND</text><path d="M320 240l55-30 30 80-55 30z" fill="#fff" stroke="#17201b" stroke-width="5"/><text x="365" y="265" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">MARGIN</text><text x="365" y="288" text-anchor="middle" font-family="Arial" font-size="18">CALL</text><circle cx="430" cy="185" r="42" fill="#ffd7b5" stroke="#17201b" stroke-width="4"/><path d="M390 345q40-120 80 0" fill="#7da6d9" stroke="#17201b" stroke-width="5"/><rect x="470" y="230" width="135" height="90" rx="10" fill="#cfe8d7" stroke="#17201b" stroke-width="4"/><text x="538" y="265" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">$400M</text><text x="538" y="292" text-anchor="middle" font-family="Arial" font-size="18">VC</text><circle cx="438" cy="235" r="18" fill="none" stroke="#d3a52f" stroke-width="7"/><path d="M585 180h150v115H585z" fill="#fff" stroke="#17201b" stroke-width="5"/><text x="660" y="225" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700">AI</text><text x="660" y="255" text-anchor="middle" font-family="Arial" font-size="17">FULL SPEED AHEAD</text><text x="400" y="414" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Maybe the thesis survives. Maybe the leverage does not.</text></svg>