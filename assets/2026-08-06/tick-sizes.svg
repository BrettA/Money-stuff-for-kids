<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Prediction market tick size illustration</title><desc id="d">Two toll booths both charge one penny: one on a fifty-cent prediction contract and one on a hundred-dollar stock trade.</desc><rect width="800" height="450" rx="30" fill="#fff5df"/><text x="400" y="55" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">SAME PENNY. VERY DIFFERENT BITE.</text><rect x="65" y="115" width="285" height="210" rx="24" fill="#fff" stroke="#17201b" stroke-width="5"/><text x="207" y="155" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">PREDICTION CONTRACT</text><circle cx="155" cy="230" r="65" fill="#b9d6f2" stroke="#17201b" stroke-width="4"/><text x="155" y="240" text-anchor="middle" font-family="Arial" font-size="35" font-weight="700">50¢</text><rect x="245" y="205" width="78" height="70" rx="10" fill="#cfe8d7" stroke="#17201b" stroke-width="4"/><text x="284" y="247" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">1¢</text><text x="207" y="300" text-anchor="middle" font-family="Arial" font-size="18">≈ 2% tick</text><rect x="450" y="115" width="285" height="210" rx="24" fill="#fff" stroke="#17201b" stroke-width="5"/><text x="592" y="155" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">STOCK TRADE</text><circle cx="540" cy="230" r="65" fill="#d9d2f0" stroke="#17201b" stroke-width="4"/><text x="540" y="240" text-anchor="middle" font-family="Arial" font-size="31" font-weight="700">$100+</text><rect x="630" y="205" width="78" height="70" rx="10" fill="#cfe8d7" stroke="#17201b" stroke-width="4"/><text x="669" y="247" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">1¢</text><text x="592" y="300" text-anchor="middle" font-family="Arial" font-size="18">tiny tick</text><text x="400" y="392" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">A penny can be a tollbooth or a rounding error.</text></svg>